  <text x="268" y="218" font-family="monospace" font-size="13" fill="#28c940">$ <tspan fill="#28c940" opacity="0.9">█</tspan></text>
  <text x="400" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="1">Linux Administration</text>
  <text x="400" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#28c940" letter-spacing="2">MASTER THE COMMAND LINE</text>
  <text x="400" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2a3a2a">TIER 2 · INTERMEDIATE · 4 WEEKS</text>
